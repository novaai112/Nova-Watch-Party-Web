<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova — My Account</title>
<meta name="theme-color" content="#f4f4f2">
<script src="theme.js"></script>
<script src="translator.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--page:#f4f4f2;--card:#fff;--line:#e5e9f0;--tx:#0f172a;--mu:#64748b;--ac:#2563eb;--ac2:#1d4ed8;--onac:#fff;--soft:#f6f8fc;--chip:#0f172a0a;--chip2:#0f172a14;--inp:#fff;--ok:#059669;--okb:#dcfce7;--okt:#15803d;--bad:#dc2626;--sheet:#fff;--shadow:0 1px 2px #0f172a0a,0 8px 24px #0f172a0b;--nav:#fff;--navon:#0f172a;--navonfg:#fff;--navic:#475569;--onbg:#eaf1ff;--plb:#f3e8ff;--plt:#7e22ce}
[data-theme=dark]{--page:#080d18;--card:#111a2b;--line:#202c42;--tx:#f1f5f9;--mu:#94a3b8;--ac:#3b82f6;--ac2:#2563eb;--soft:#0d1524;--chip:#ffffff10;--chip2:#ffffff1c;--inp:#0b1322;--ok:#34d399;--okb:#0c2a1f;--okt:#4ade80;--bad:#f87171;--sheet:#111a2b;--shadow:0 1px 2px #0007;--nav:#111a2b;--navon:#f1f5f9;--navonfg:#0f172a;--navic:#94a3b8;--onbg:#16264a;--plb:#2b1747;--plt:#d8b4fe}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--tx);background:var(--page);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
@media(min-width:900px){
 body{background:radial-gradient(900px 620px at 0% 0%,#d6e6ff 0%,transparent 65%),radial-gradient(1000px 720px at 88% 102%,#a4ece2 0%,transparent 62%),radial-gradient(700px 520px at 100% 38%,#bfe9fb 0%,transparent 60%),linear-gradient(180deg,#f7faff,#f1fbf9);background-attachment:fixed}
 [data-theme=dark] body{background:radial-gradient(900px 620px at 0% 0%,#10244a 0%,transparent 65%),radial-gradient(1000px 720px at 88% 102%,#0b3a3d 0%,transparent 62%),radial-gradient(700px 520px at 100% 38%,#0d2b45 0%,transparent 60%),#080d18;background-attachment:fixed}}
#app{max-width:1240px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
@media(min-width:900px){#app{padding:24px 24px 56px}}
.ic{flex:none;vertical-align:middle}
button,.btn{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:inherit}.mu{color:var(--mu)}
@media(min-width:900px){.mo{display:none!important}}@media(max-width:899px){.do{display:none!important}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow)}
.pad{padding:18px}.pbody{padding:20px 24px 24px}
.sub{font-size:12px;font-weight:700;margin:20px 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}.sub:first-child{margin-top:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px;border-bottom:1px solid var(--line)}
.pt h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25}.pt p{margin:2px 0 0;color:var(--mu);font-size:13px}
.actg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-weight:700;transition:opacity .15s,transform .05s,background .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.pri,.btn.pri{background:var(--ac);color:var(--onac);box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 32%,transparent);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-weight:700}
.pri:hover:not([disabled]){background:var(--ac2)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--tx)}.btn.sec:hover{background:var(--chip)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}.btn.blk{width:100%}
.dng{background:var(--bad);color:#fff;padding:0 20px;height:44px;border-radius:10px;font-weight:700}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--tx);flex:none;transition:background .15s}
.ib:hover{background:var(--chip)}.ib.sm{width:36px;height:36px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;line-height:1.5}
.pill.ok{background:var(--okb);color:var(--okt)}.pill.pl{background:var(--plb);color:var(--plt)}
.avt{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;font-weight:700}
.avt.ring{box-shadow:0 0 0 4px var(--card),0 4px 16px #0f172a22}
/* desktop shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}.crumb b{color:var(--tx);font-weight:700}.crumb i{font-style:normal;opacity:.5}
.crumb a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500}.crumb a:hover{color:var(--tx)}
.ucp{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding:4px 4px 4px 14px;border-radius:999px}.ucp:hover{background:var(--chip)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:20px}
.hello{display:flex;align-items:center;gap:14px;padding:20px}
.hello small{display:block;color:var(--mu);font-size:12px;line-height:1}.hello b{display:block;font-size:15px;font-weight:800;margin:3px 0 6px;overflow-wrap:anywhere}.hello .pill{margin:0}
.nav{padding:0}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;border-top:1px solid var(--line);font-weight:500;font-size:14px;text-align:left;transition:background .15s;position:relative}
.nv:first-child{border-top:0}.nv:hover{background:var(--chip)}
.nv .ni{color:var(--c,var(--ac));display:grid;place-items:center}.nv .go{margin-left:auto;color:var(--mu);opacity:.65;display:grid}
.nv.on{background:var(--onbg);color:var(--ac);font-weight:700;box-shadow:inset 3px 0 0 var(--ac)}
.nv.out{color:var(--bad);font-weight:700}.nv.out .ni{color:var(--bad)}
.bd{font-style:normal;background:#ef4444;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nv .bd{margin-left:auto}.nv .bd+.go{margin-left:6px}
.cred{background:linear-gradient(135deg,#1e40af,#2563eb 60%,#3b82f6);color:#fff;border-radius:16px;padding:18px;box-shadow:0 10px 26px #2563eb40}
.cred small{opacity:.85;font-weight:600;font-size:12px}.cred .big{display:flex;align-items:baseline;gap:6px;margin:4px 0 12px}.cred .big b{font-size:30px;font-weight:800;line-height:1}.cred .big span{opacity:.8;font-size:13px}
.pb{height:8px;border-radius:99px;background:#ffffff40;overflow:hidden}.pb i{display:block;height:100%;background:#fff;border-radius:99px}
.cred button{width:100%;margin-top:14px;height:38px;border-radius:9px;background:#fff;color:#1d4ed8;font-weight:700;font-size:13px}
/* info / stats */
.idstrip{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--soft);border-bottom:1px solid var(--line)}
.idt{min-width:0}.idt h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em;overflow-wrap:anywhere}.idt p{margin:2px 0 0;color:var(--mu);overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:22px 24px}
.fc{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);min-width:0;text-decoration:none;text-align:left}
.fc.wide{grid-column:1/-1}.fc.bio{align-items:flex-start}.fc.lnk:hover{border-color:var(--ac);background:var(--onbg)}
.fi{width:40px;height:40px;border-radius:11px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.fv{min-width:0;flex:1}.fv small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);line-height:1.3}.fv b{display:block;font-size:14.5px;font-weight:700;margin-top:1px;overflow-wrap:anywhere}
.biot{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;margin-top:1px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 24px 24px}
.tile{border-radius:14px;padding:18px 10px;text-align:center;border:1px solid}.tile b{display:block;font-size:28px;font-weight:800;line-height:1.1}.tile span{display:block;font-size:12px;font-weight:600;margin-top:6px}
.tile.blue{background:#eef3ff;border-color:#c7d7fe;color:#1d3fd8}.tile.green{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.tile.indigo{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}.tile.yellow{background:#fffbeb;border-color:#fde68a;color:#b45309}
[data-theme=dark] .tile.blue{background:#13234a;border-color:#27408a;color:#93b4ff}[data-theme=dark] .tile.green{background:#0b2a22;border-color:#14614a;color:#6ee7b7}[data-theme=dark] .tile.indigo{background:#1b1f4b;border-color:#3b3f94;color:#a5b4fc}[data-theme=dark] .tile.yellow{background:#2c2410;border-color:#6b5415;color:#fcd34d}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--mu);padding:30px 16px}.empty p{margin:0}
/* gallery */
.dz{margin:20px 24px 0;border:1.5px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--mu);transition:border-color .15s,background .15s;cursor:pointer;display:block}
.dz:hover,.dz.over{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 7%,transparent);color:var(--tx)}.dz b{color:var(--ac)}.dz small{display:block;margin-top:2px;font-size:13px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:20px 24px 24px}.gg:empty{display:none}
.gt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}.gt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.gtb{position:absolute;inset:0;width:100%;height:100%;padding:0}.gtb:hover img{transform:scale(1.05)}
.gt .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#000b;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:2}
.gt:hover .x,.gt:focus-within .x{opacity:1}@media(hover:none){.gt .x{opacity:1}}
.gt.up{display:grid;place-items:center;border:1px dashed var(--line)}
.gt.gadd{display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--ac);background:var(--soft);transition:border-color .15s,background .15s}
.gt.gadd:hover{border-color:var(--ac);background:var(--onbg)}.gt.gadd .ic{width:28px;height:28px}
.gerr{display:flex;gap:8px;align-items:flex-start;margin:20px 24px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);font-size:13px}
/* friends */
.addf{display:flex;gap:10px}.addf .pre{flex:1}.addf .btn{flex:none}
.frg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:18px}
.frc{display:grid;justify-items:center;gap:2px;padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);text-align:center;transition:border-color .15s}
.frc:hover{border-color:var(--ac)}.frc .avt{margin-bottom:8px}.frc b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frc small{color:var(--mu);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.reqr{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft);margin-bottom:10px}.reqr .fv b{font-size:14px}.reqr .fv small{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
/* activity */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tab{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mu);background:var(--chip)}.tab.on{background:var(--ac);color:var(--onac)}
.vrow{display:flex;gap:12px;overflow-x:auto;padding:4px 0 6px}.vid{width:170px;flex:none;color:inherit;text-decoration:none}.vid img{width:170px;height:100px;border-radius:12px;object-fit:cover;background:var(--chip);display:block;margin-bottom:6px}
.vid b{display:block;font-size:13px;font-weight:600;max-height:38px;overflow:hidden}.vid small{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:13px;text-decoration:none}.chip small{color:var(--mu)}
a.chip:hover{border-color:var(--ac)}.chip .ic{color:var(--ac)}
.donutw{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:600;color:var(--mu)}
.legend{display:grid;gap:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.legend b{color:var(--mu);font-weight:600;margin-left:4px}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}.subh:first-child{margin-top:0}.subh h3{margin:0;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.nsfw{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
/* rows */
.row{display:flex;align-items:center;gap:14px;padding:15px 24px;width:100%;text-align:left;border-top:1px solid var(--line);transition:background .15s}
.rows .row:first-child{border-top:0}button.row:hover,label.row:hover{background:var(--chip)}
.row .i{width:38px;height:38px;border-radius:11px;background:var(--onbg);display:grid;place-items:center;flex:none;color:var(--ac)}
.row .m{flex:1;min-width:0;font-weight:600}.row small{display:block;color:var(--mu);font-size:13px;line-height:1.35;font-weight:400}.row .go{color:var(--mu);display:grid}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:14px;background:var(--chip2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0;border:0}
.sw:checked{background:var(--ac)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.2s}.sw:checked:after{left:22px}.sw:disabled{cursor:not-allowed;opacity:.5}
input[type=checkbox]{accent-color:var(--ac)}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.danger{margin-top:26px;padding:18px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:14px;background:color-mix(in srgb,var(--bad) 6%,transparent)}.danger h3{margin:0 0 4px;font-size:15px;color:var(--bad)}.danger p{margin:0 0 12px}
.legal h3{margin:16px 0 4px;font-size:15px}.legal p{margin:0;color:var(--mu)}
/* forms */
.fld{display:block;margin:0 0 16px}.fld>span.l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:7px}.fld .l em{font-style:normal;color:var(--mu);font-weight:500;font-size:13px}
input[type=text],input[type=url],input[type=password],input[type=email],input:not([type]),select,textarea{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
input:disabled{background:var(--soft);color:var(--mu);cursor:not-allowed}
textarea{height:auto;padding:12px 14px;resize:vertical;min-height:100px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
input.bad{border-color:var(--bad)}input::placeholder,textarea::placeholder{color:var(--mu);opacity:.7}
.pre{display:flex;align-items:stretch}.pre>b{display:grid;place-items:center;padding:0 13px;border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;background:var(--soft);color:var(--mu);font-weight:600;white-space:nowrap}.pre input{border-radius:0 10px 10px 0}
.hint{display:flex;align-items:center;gap:6px;min-height:20px;margin-top:6px;font-size:13px;color:var(--mu)}.hint:empty{display:none}.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.note{margin:-8px 0 16px;font-size:12.5px;color:var(--mu)}
.soc{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}.soc .si{width:44px;height:44px;border-radius:11px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.soc-remove{width:44px;height:44px;border-radius:11px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.soc-add{margin-top:4px}
.soc .sb{flex:1;min-width:0}.soc .sl{font-size:13px;font-weight:700;margin-bottom:5px}.soc .hint{margin-top:4px;min-height:0}
.secrows{display:grid;gap:14px;padding:22px 24px}
.secrow{display:flex;align-items:center;gap:16px;min-height:86px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.secico{width:44px;height:44px;border-radius:12px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.secico.red{background:#fee2e2;color:#dc2626}.secico.green{background:#d1fae5;color:#059669}.secico.purple{background:#f3e8ff;color:#9333ea}
.secinfo{min-width:0;flex:1}.secinfo b{display:block;font-size:14px}.secinfo small{display:block;color:var(--mu);margin-top:2px;overflow-wrap:anywhere}
.status{padding:5px 12px;border-radius:999px;background:var(--okb);color:var(--okt);font-size:12px;font-weight:700}.status.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.sec-danger{padding:20px;border:1px solid #fecaca;border-radius:14px;background:#fff1f2;color:#b91c1c}
.sec-danger b{display:block}.sec-danger p{margin:4px 0 14px;font-size:13px;color:#dc2626}
.mav{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}.avwrap{position:relative;flex:none}
.avwrap.busy .avt{opacity:.45}.avwrap.busy:after{content:"";position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;border:3px solid var(--chip2);border-top-color:var(--ac);animation:sp .7s linear infinite}
.avact{display:flex;gap:8px;flex-wrap:wrap}.avnote{flex-basis:100%;margin:0;font-size:13px;color:var(--mu)}
/* popup */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:60}.ov.c{align-items:center;padding:16px}
.modal{width:min(460px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--sheet);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s ease-out;color:var(--tx)}
.mh{display:flex;align-items:center;gap:10px;background:var(--ac);color:#fff;padding:18px 22px;flex:none}.mh b{flex:1;font-size:17px;font-weight:800}
.mx{color:#fff;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;opacity:.9}.mx:hover{background:#ffffff26;opacity:1}
.mb{padding:22px;overflow:auto;overscroll-behavior:contain}
.macts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.macts .btn{width:100%}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;color:var(--tx)}.ov.c .sheet{border-radius:18px;margin:16px}

<label class=row><span class=i>${ic('db')}</span><span class=m>${t('noshare')}</span><input type=checkbox class=sw data-k=noShare ${Nova.S.noShare?'checked':''}></label></div>`)),

setup:()=>`<div class=setup><div class=stepper><i></i>Almost there</div><h1>Set up your profile</h1><p class=lead>Choose a username and, if you like, a profile photo. Friends use your username to find you.</p>

async function loadP(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',U.id).single();if(error)throw error;P=data||{};
 const g=await sb.from('gallery').select('*').eq('user_id',U.id).order('created_at',{ascending:false});P._g=g.data||[];P._gerr=g.error?g.error.message:'';
 try{const {data:sub}=await sb.from('subscriptions').select('status,current_period_end').maybeSingle();const act=sub&&sub.status==='active'&&new Date(sub.current_period_end)>new Date();PLAN={pro:!!act,end:act?sub.current_period_end:null}}catch(_){}
}
async function fetchPD(id){
 const {data,error}=await sb.rpc('public_profile',{p_uid:id,p_preview:PREVIEW&&id===U.id,p_nsfw:NSFW});
 PD=error?null:data;FAILED=PD?null:id;
 if(PD&&PD.own){const r=(await sb.from('friendships').select('user_id').eq('friend_id',U.id).eq('status','pending')).data||[],ids=r.map(x=>x.user_id);
  REQ=ids.length?(await sb.from('public_profiles').select('id,full_name,username,avatar_url').in('id',ids)).data||[]:[]}
}
async function route(){
 if(!U)return;
 const h=(location.hash||'#home').slice(1).split('/'),k=h[0];
 if(!P.username&&k!=='setup'){location.replace('#setup');return}
 if(P.username&&k==='setup'){location.replace('#home');return}
 if(!V[k]||(k==='home'&&DESK.matches)){location.replace(DESK.matches?'#info':'#home');return}
 const my=++RT;
 if(k!=='preview'&&PREVIEW){PREVIEW=false;PD=null}
 if(k==='setup'){}
 else if(k==='user'){const id=h[1];if(!id||id===U.id){location.replace('#info');return}if(!PD||PD.id!==id){app.innerHTML=skel();await fetchPD(id)}}
 else if(k==='preview'){if(!PREVIEW||!PD||PD.id!==U.id||PD.own){PREVIEW=true;app.innerHTML=skel();await fetchPD(U.id)}}
 else if(!PD||PD.id!==U.id||!PD.own){app.innerHTML=skel();await fetchPD(U.id)}
 if(my!==RT)return;
 if(!PD&&k!=='setup'){app.innerHTML='<div class="card pad"><p>We could not load this profile. Check your connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>';return}
 app.innerHTML=V[k](h[1]);Nova.applyLang();
 if(k==='setup')initSetup();
}
const ask=(title,text,ok='Delete',danger=true)=>new Promise(r=>{const o=document.createElement('div');o.className='ov c';o.style.zIndex=70;o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
 o.innerHTML=`<div class=sheet><h3>${esc(title)}</h3><p>${esc(text)}</p><div class=acts><button class="btn sec" data-n>${t('cancel')}</button><button class="btn ${danger?'':'pri'}" ${danger?'style="background:var(--bad);color:#fff"':''} data-y>${esc(ok)}</button></div></div>`;
 o.onclick=e=>{if(e.target===o||e.target.closest('[data-n]')){o.remove();r(false)}else if(e.target.closest('[data-y]')){o.remove();r(true)}};document.body.append(o);o.querySelector('[data-n]').focus()});
function openSecurityModal(title,body,icon){
 const current=document.getElementById('mdl');if(current)current.remove();
 const o=document.createElement('div');o.className='ov c';o.id='mdl';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
 o.innerHTML=`<div class=modal><div class=mh>${ic(icon,18)}<b>${title}</b><button class=mx data-close aria-label="Close">${ic('x',18)}</button></div><div class=mb>${body}</div></div>`;
 o.addEventListener('mousedown',e=>{if(e.target===o){o.remove();document.body.classList.remove('lock')}});
 document.body.append(o);document.body.classList.add('lock');
}
function closeSecurityModal(){const modal=document.getElementById('mdl');if(modal)modal.remove();document.body.classList.remove('lock')}
function openPasswordModal(){
 openSecurityModal(t('changePassword'),`<label class=fld><span class=l>${t('newPassword')}</span><input id=securityPassword type=password autocomplete=new-password minlength=8 placeholder="${t('passwordRequirement')}"></label>
<label class=fld><span class=l>${t('confirmPassword')}</span><input id=securityPasswordConfirm type=password autocomplete=new-password minlength=8 placeholder="${t('confirmPassword')}"></label>
<div class=macts><button class="btn sec" data-close>${t('cancel')}</button><button class="btn pri" data-act=savePassword>${t('updatePassword')}</button></div>`,'lock');
}
function openDeleteModal(){
 openSecurityModal(t('deleteAccount'),`<p>${t('deleteWarning')}</p><label class=fld><span class=l>${t('typeDelete')}</span><input id=deleteConfirm autocomplete=off></label>
<div class=macts><button class="btn sec" data-close>${t('cancel')}</button><button class="btn dng" data-act=confirmDelete>${t('deleteAccount')}</button></div>`,'trash');
}

const dropOld=u=>{const m=/\/avatars\/([^?]+)/.exec(u||'');if(m)sb.storage.from('avatars').remove([decodeURIComponent(m[1])])};
async function uploadAvatar(file){
 if(file.size>15e6)throw new Error('That image is larger than 15 MB');
 const blob=await Nova.imgBlob(file,512,.88,true),path=`${U.id}/avatar_${Date.now()}.jpg`;
 const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
 const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
 const {error}=await sb.from('profiles').update({avatar_url:url}).eq('id',U.id);if(error){sb.storage.from('avatars').remove([path]);throw error}
 dropOld(P.avatar_url);P.avatar_url=url;inv()}
function avActs(){return P.avatar_url?'<button class=link data-act=rmAv>Remove photo</button>':''}
function paintAv(){document.querySelectorAll('.avtap').forEach(b=>{const a=b.querySelector('.avt');if(a)a.outerHTML=Nova.avatar(P,+b.dataset.s,b.dataset.c||'')});const a=$('#ava');if(a)a.innerHTML=avActs()}
const refreshBehind=()=>{if((location.hash||'').slice(1)!=='setup')route()};

function initSetup(){
 const go=$('#go'),upd=s=>{const u=s||UN;go.disabled=!(u.ok&&!u.pending&&$('#fn').value.trim().length>=2)};
 UN=Nova.unameField($('#un'),$('#uh'),null,upd);$('#fn').addEventListener('input',upd);
}
async function saveProfile(btn,body){
 const lab=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class=spin></i> Saving…';
 const {error}=await sb.from('profiles').update(body).eq('id',U.id);btn.disabled=false;btn.innerHTML=lab;
 if(error){const taken=error.code==='23505',h=$('#uh');
  if(h&&body.username){h.className='hint bad';h.innerHTML=ic('alert',14)+'<span>'+(taken?'That username was just taken. Try another.':'This username is not allowed.')+'</span>'}
  Nova.toast(taken||/username/i.test(error.message)?(taken?'Username already taken':'Invalid username'):error.message,'err');return false}
 await loadP();inv();return true}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-go],[data-act],[data-lang]');if(!el)return;const d=el.dataset;
 if(d.go){if(d.go=='back'){history.length>1?history.back():location.hash='home'}else location.hash=d.go}
 if(d.lang){await Nova.set('lang',d.lang);route()}
 if(d.act=='out'){await sb.auth.signOut();location.href='index.html'}
 if(d.act=='changePassword')openPasswordModal();
 if(d.act=='openDelete')openDeleteModal();
 if(d.act=='savePassword'){
  const password=$('#securityPassword').value,confirm=$('#securityPasswordConfirm').value;
  if(password.length<8||!/\d/.test(password)||!/[^\p{L}\p{N}]/u.test(password))return Nova.toast(t('passwordRequirement'),'err');
  if(password!==confirm)return Nova.toast(t('passwordMismatch'),'err');
  el.disabled=true;
  try{const {error}=await sb.auth.updateUser({password});if(error)throw error;closeSecurityModal();Nova.toast(t('passwordUpdated'))}
  catch(er){Nova.toast(er.message||t('passwordFailed'),'err')}
  finally{el.disabled=false}
 }
 if(d.act=='confirmDelete'){
  if($('#deleteConfirm').value!=='DELETE')return Nova.toast(t('typeDelete'),'err');
  el.disabled=true;
  const {error}=await sb.rpc('delete_my_account');
  if(error){el.disabled=false;return Nova.toast(error.message,'err')}
  await sb.auth.signOut();location.href='index.html';
 }
 if(d.act=='emoji'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=sheet><div class=em>${EMOJI.map(x=>`<button>${x}</button>`).join('')}</div></div>`;
  o.onclick=async ev=>{if(ev.target.tagName=='BUTTON')await Nova.set('quick',ev.target.textContent);o.remove();route()};document.body.append(o)}
 if(d.act=='pickAv'){AVT=el;$('#avf').click()}
 if(d.act=='rmAv'&&await ask('Remove profile photo?','Your initials will be shown instead.','Remove')){
  const old=P.avatar_url,{error}=await sb.from('profiles').update({avatar_url:null}).eq('id',U.id);if(error)return Nova.toast(error.message,'err');
  dropOld(old);P.avatar_url=null;inv();paintAv();Nova.toast('Photo removed')}
 if(d.act=='setupGo'){const name=$('#fn').value.trim();if(!UN.ok||name.length<2)return;
  if(await saveProfile(el,{full_name:name,username:UN.val})){Nova.toast(`Welcome, @${P.username}`);location.hash=DESK.matches?'info':'home'}}
 if(d.act=='ticket'){const {error}=await sb.from('support_tickets').insert({user_id:U.id,email:U.email,subject:$('#sj').value,message:$('#ms').value});
  $('#tout').textContent=error?(/permission denied/i.test(error.message)?'Permission denied. Run fix-gallery-permissions.sql in Supabase once.':'Please fill subject (3+) and message (10+ characters).'):'Sent. We will reply by email.';if(!error){$('#sj').value='';$('#ms').value=''}}
});
document.addEventListener('input',e=>{if(e.target.id!=='languageSearch')return;
 const q=normalizeLanguageSearch(e.target.value.trim());let shown=0;
 document.querySelectorAll('#languageRows [data-language]').forEach(row=>{const match=!q||row.dataset.language.includes(q);row.hidden=!match;row.style.display=match?'flex':'none';if(match)shown++});
 const empty=document.querySelector('#languageRows .language-empty');if(empty)empty.hidden=shown!==0;
});
document.addEventListener('change',async e=>{const x=e.target;
 if(x.id==='avf'){const f=x.files[0];x.value='';if(!f)return;const w=AVT;w&&w.classList.add('busy');
  try{await uploadAvatar(f);paintAv();Nova.toast('Profile photo updated')}catch(er){Nova.toast(er.message||'Upload failed','err')}w&&w.classList.remove('busy');return}
 const k=x.dataset?.k;if(!k)return;
 if(k=='hideMature'&&!x.checked){x.checked=true;if(await ask('Enable 🔞 Mature Content','Explicit 18+ content may be shown. Only turn this on if you are 18 or older.',t('yes'),false)){await Nova.set('hideMature',false);route()}return}
 await Nova.set(k,x.checked)});
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
DESK.addEventListener?DESK.addEventListener('change',()=>route()):DESK.addListener(()=>route());
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.href='index.html'});
/* boot only after nova-profile.js has registered its views (it loads right after this script) */
const boot=async()=>{app.innerHTML=skel();
 const {data}=await sb.auth.getSession();if(!data.session){try{sessionStorage.setItem('postLoginRedirect','profile.html')}catch(_){}return location.href='index.html'}
 U=data.session.user;await Nova.sync(U.id);
 try{await loadP()}catch(er){app.innerHTML='<div class="card pad"><p>We could not load your profile. Check your connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>';return}
 route()};
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot):boot();
