<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova — My Account</title>
<meta name="theme-color" content="#f8fafc">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --page:#f8fafc;--card:#ffffff;--line:#e2e8f0;--tx:#0f172a;--mu:#64748b;--ac:#2874f0;--ac2:#1a5dc9;
  --onac:#ffffff;--soft:#f8fafc;--chip:#f1f5f9;--chip2:#e2e8f0;--inp:#ffffff;--ok:#16a34a;--okb:#ecfdf5;
  --okt:#047857;--bad:#ef4444;--sheet:#ffffff;--shadow:0 4px 20px -2px rgba(15,23,42,0.05),0 2px 6px -1px rgba(15,23,42,0.03);
  --nav:#ffffff;--navon:#0f172a;--navonfg:#ffffff;--navic:#64748b;--onbg:#e8f0fe;--plb:#faf5ff;--plt:#9333ea;
}
[data-theme=dark]{
  --page:#080d18;--card:#111a2b;--line:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ac:#3b82f6;--ac2:#2563eb;
  --soft:#0d1524;--chip:#1e293b;--chip2:#334155;--inp:#0f172a;--ok:#4ade80;--okb:#0c2a1f;--okt:#6ee7b7;
  --bad:#f87171;--sheet:#111a2b;--shadow:0 4px 24px -2px rgba(0,0,0,0.5);--nav:#111a2b;--navon:#ffffff;
  --navonfg:#0f172a;--navic:#94a3b8;--onbg:#16264a;--plb:#2b1747;--plt:#d8b4fe;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--tx);background:var(--page);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;overflow-x:hidden}
body.lock{overflow:hidden}

/* Luminous atmospheric glowing background mesh */
.bg-mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.75;pointer-events:none;animation:blobFloat 12s infinite alternate ease-in-out}
.blob-1{top:-10%;left:-8%;width:55vw;height:55vw;max-width:650px;max-height:650px;background:rgba(59,130,246,0.22);mix-blend-mode:multiply}
.blob-2{top:15%;right:-8%;width:60vw;height:60vw;max-width:750px;max-height:750px;background:rgba(6,182,212,0.22);mix-blend-mode:multiply;animation-delay:2.5s}
.blob-3{bottom:-15%;left:20%;width:60vw;height:60vw;max-width:700px;max-height:700px;background:rgba(16,185,129,0.18);mix-blend-mode:multiply;animation-delay:5s}
[data-theme="dark"] .blob{mix-blend-mode:screen;opacity:.35}
[data-theme="dark"] .blob-1{background:rgba(59,130,246,0.35)}
[data-theme="dark"] .blob-2{background:rgba(14,165,233,0.3)}
[data-theme="dark"] .blob-3{background:rgba(16,185,129,0.25)}

@keyframes blobFloat{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(30px,-40px) scale(1.08)}
  100%{transform:translate(-25px,25px) scale(0.94)}
}

#app{max-width:1240px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom));position:relative;z-index:2}
@media(min-width:900px){#app{padding:24px 24px 56px}}
.ic{flex:none;vertical-align:middle}
button,.btn{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:inherit}.mu{color:var(--mu)}
@media(min-width:900px){.mo{display:none!important}}@media(max-width:899px){.do{display:none!important}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow)}
.pad{padding:20px}.pbody{padding:22px 24px 24px}
.sub{font-size:11px;font-weight:800;margin:20px 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}.sub:first-child{margin-top:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px;border-bottom:1px solid var(--line)}
.pt h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.015em;line-height:1.25}.pt p{margin:3px 0 0;color:var(--mu);font-size:13px;font-weight:500}
.actg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:700;transition:all .15s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.pri,.btn.pri{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:var(--onac);box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 32%,transparent);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:800;border:none}
.pri:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--tx);font-weight:700}.btn.sec:hover{background:var(--chip)}
.btn.sm{height:38px;padding:0 14px;font-size:13px}.btn.blk{width:100%}
.dng{background:var(--bad);color:#fff;padding:0 20px;height:42px;border-radius:10px;font-weight:800;border:none}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--tx);flex:none;transition:background .15s}
.ib:hover{background:var(--chip)}.ib.sm{width:36px;height:36px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;line-height:1.5;border:1px solid transparent}
.pill.ok{background:var(--okb);color:var(--okt);border-color:#a7f3d0}
.pill.pl{background:var(--plb);color:var(--plt);border-color:#f3e8ff}
.avt{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;background:#ffffff;box-shadow:0 2px 8px rgba(0,0,0,0.08);color:var(--ac);font-weight:700}
.avt.ring{box-shadow:0 0 0 4px #ffffff,0 8px 24px rgba(15,23,42,0.12)}
[data-theme=dark] .avt.ring{box-shadow:0 0 0 4px #1e293b,0 8px 24px rgba(0,0,0,0.4)}

/* tap-to-change profile photo everywhere */
.avtap{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:transparent;padding:0;cursor:pointer;flex:none;line-height:0;
  transition:transform .18s ease;outline:none;
}
.avtap:hover{transform:scale(1.04)}
.avtap .avcam{
  position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--ac);
  color:#fff;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.18);
  transition:transform .15s,background .15s;
}
[data-theme=dark] .avtap .avcam{border-color:#111a2b}
.avtap:hover .avcam{transform:scale(1.15);background:var(--ac2)}
.avtap.s .avcam{width:18px;height:18px;right:-2px;bottom:-2px;border-width:1.5px}
.mid .avtap .avcam{width:32px;height:32px;right:4px;bottom:4px;border-color:#fff}
.avtap.busy .avt{opacity:.4}
.avtap.busy::after{
  content:"";position:absolute;inset:0;margin:auto;width:24px;height:24px;border-radius:50%;
  border:3px solid var(--chip2);border-top-color:var(--ac);animation:sp .7s linear infinite;
}

/* desktop shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu)}.crumb b{color:var(--tx);font-weight:800}.crumb i{font-style:normal;opacity:.5}
.crumb a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600}.crumb a:hover{color:var(--tx)}
.ucp{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding:4px 4px 4px 14px;border-radius:999px}.ucp:hover{background:var(--chip)}
.unm{font-weight:800;font-size:14px;color:var(--tx)}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:20px}
.hello{display:flex;align-items:center;gap:14px;padding:20px}
.hello small{display:block;color:var(--mu);font-size:11.5px;font-weight:600;line-height:1}.hello b{display:block;font-size:16px;font-weight:900;margin:3px 0 6px;overflow-wrap:anywhere}.hello .pill{margin:0}
.nav{padding:0}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:13.5px 18px;border-top:1px solid var(--line);font-weight:600;font-size:13.5px;text-align:left;color:#334155;transition:all .15s;position:relative}
[data-theme=dark] .nv{color:#cbd5e1}
.nv:first-child{border-top:0}.nv:hover{background:var(--soft);color:var(--tx)}
.nv .ni{color:var(--c,var(--ac));display:grid;place-items:center}.nv .go{margin-left:auto;color:#94a3b8;opacity:.8;display:grid}
.nv.on{background:var(--onbg);color:var(--ac);font-weight:800;box-shadow:inset 4px 0 0 var(--ac)}
.nv.out{color:var(--bad);font-weight:800}.nv.out .ni{color:var(--bad)}
.bd{font-style:normal;background:#ef4444;color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nv .bd{margin-left:auto}.nv .bd+.go{margin-left:6px}

/* Sidebar Gradient Card */
.cred{
  background:linear-gradient(135deg,#2874f0 0%,#0c47ba 100%);
  color:#fff;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(40,116,240,0.28);
}
.cred small{color:#bfdbfe;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.cred .big{display:flex;align-items:baseline;gap:6px;margin:4px 0 10px}
.cred .big b{font-size:26px;font-weight:900;line-height:1;color:#fff}
.cred .big span{color:#bfdbfe;font-size:13px;font-weight:600}
.cred .pb{height:6px;border-radius:9999px;background:rgba(255,255,255,0.25);overflow:hidden;margin-bottom:14px}
.cred .pb i{display:block;height:100%;background:#ffffff;border-radius:9999px}
.cred button{width:100%;height:38px;border-radius:10px;background:#ffffff;color:#2874f0;font-weight:800;font-size:12.5px;border:none;cursor:pointer;transition:background .15s ease}
.cred button:hover{background:#f0f7ff}

/* info / stats fields */
.idstrip{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--soft);border-bottom:1px solid var(--line)}
.idt{min-width:0}.idt h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.015em;overflow-wrap:anywhere}.idt p{margin:2px 0 0;color:var(--mu);font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:22px 24px}
.fc{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--soft);min-width:0;text-decoration:none;text-align:left;transition:all .15s}
.fc:hover{border-color:rgba(40,116,240,0.35);box-shadow:0 2px 8px rgba(40,116,240,0.06)}
.fc.wide{grid-column:1/-1}.fc.bio{align-items:flex-start}.fc.lnk:hover{border-color:var(--ac);background:var(--onbg)}
.fi{width:38px;height:38px;border-radius:10px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.fv{min-width:0;flex:1}.fv small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:2px}.fv b{display:block;font-size:14px;font-weight:800;color:var(--tx);overflow-wrap:anywhere}
.biot{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;margin-top:1px;font-size:13.5px}

/* Metric Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 24px 24px}
.tile{border-radius:14px;padding:16px 10px;text-align:center;border:1px solid;transition:transform .15s ease}
.tile:hover{transform:translateY(-1px)}
.tile b{display:block;font-size:26px;font-weight:900;line-height:1.1}
.tile span{display:block;font-size:11px;font-weight:700;margin-top:4px}
.tile.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.tile.green{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
.tile.indigo{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}
.tile.yellow{background:#fffbeb;border-color:#fde68a;color:#b45309}
[data-theme=dark] .tile.blue{background:#13234a;border-color:#27408a;color:#93b4ff}
[data-theme=dark] .tile.green{background:#0b2a22;border-color:#14614a;color:#6ee7b7}
[data-theme=dark] .tile.indigo{background:#1b1f4b;border-color:#3b3f94;color:#a5b4fc}
[data-theme=dark] .tile.yellow{background:#2c2410;border-color:#6b5415;color:#fcd34d}

.empty{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--mu);padding:32px 16px}.empty p{margin:0;font-weight:500}

/* gallery */
.dz{margin:20px 24px 0;border:1.5px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--mu);transition:border-color .15s,background .15s;cursor:pointer;display:block}
.dz:hover,.dz.over{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 7%,transparent);color:var(--tx)}.dz b{color:var(--ac)}.dz small{display:block;margin-top:2px;font-size:13px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:20px 24px 24px}.gg:empty{display:none}
.gt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}.gt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.gtb{position:absolute;inset:0;width:100%;height:100%;padding:0}.gtb:hover img{transform:scale(1.05)}
.gt .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#000b;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:2}
.gt:hover .x,.gt:focus-within .x{opacity:1}@media(hover:none){.gt .x{opacity:1}}
.gt.up{display:grid;place-items:center;border:1px dashed var(--line)}
.gerr{display:flex;gap:8px;align-items:flex-start;margin:20px 24px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);font-size:13px}

/* friends */
.addf{display:flex;gap:10px}.addf .pre{flex:1}.addf .btn{flex:none}
.frg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:18px}
.frc{display:grid;justify-items:center;gap:2px;padding:16px 10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);text-align:center;transition:border-color .15s}
.frc:hover{border-color:var(--ac)}.frc .avt{margin-bottom:8px}.frc b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frc small{color:var(--mu);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.reqr{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft);margin-bottom:10px}.reqr .fv b{font-size:14px}.reqr .fv small{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}

/* activity */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tab{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mu);background:var(--chip)}.tab.on{background:var(--ac);color:var(--onac)}
.vrow{display:flex;gap:12px;overflow-x:auto;padding:4px 0 6px}.vid{width:170px;flex:none;color:inherit;text-decoration:none}.vid img{width:170px;height:100px;border-radius:12px;object-fit:cover;background:var(--chip);display:block;margin-bottom:6px}
.vid b{display:block;font-size:13px;font-weight:700;max-height:38px;overflow:hidden}.vid small{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-size:13px;text-decoration:none}.chip small{color:var(--mu)}
a.chip:hover{border-color:var(--ac)}.chip .ic{color:var(--ac)}
.donutw{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;color:var(--mu)}
.legend{display:grid;gap:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.legend b{color:var(--mu);font-weight:700;margin-left:4px}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}.subh:first-child{margin-top:0}.subh h3{margin:0;font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.nsfw{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}

/* rows */
.row{display:flex;align-items:center;gap:14px;padding:15px 24px;width:100%;text-align:left;border-top:1px solid var(--line);transition:background .15s}
.rows .row:first-child{border-top:0}button.row:hover,label.row:hover{background:var(--chip)}
.row .i{width:38px;height:38px;border-radius:10px;background:var(--onbg);display:grid;place-items:center;flex:none;color:var(--ac)}
.row .m{flex:1;min-width:0;font-weight:700}.row small{display:block;color:var(--mu);font-size:13px;line-height:1.35;font-weight:500}.row .go{color:#94a3b8;display:grid}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:14px;background:var(--chip2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0;border:0}
.sw:checked{background:var(--ac)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.2s}.sw:checked:after{left:22px}.sw:disabled{cursor:not-allowed;opacity:.5}
input[type=checkbox]{accent-color:var(--ac)}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.danger{margin-top:26px;padding:18px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:14px;background:color-mix(in srgb,var(--bad) 6%,transparent)}.danger h3{margin:0 0 4px;font-size:15px;color:var(--bad)}.danger p{margin:0 0 12px}
.legal h3{margin:16px 0 4px;font-size:15px}.legal p{margin:0;color:var(--mu)}

/* forms */
.fld{display:block;margin:0 0 16px}.fld>span.l{display:flex;justify-content:space-between;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;color:var(--tx)}.fld .l em{font-style:normal;color:var(--mu);font-weight:600;font-size:11px}
input[type=text],input[type=url],input:not([type]),textarea{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
input:disabled{background:var(--soft);color:var(--mu);cursor:not-allowed}
textarea{height:auto;padding:12px 14px;resize:vertical;min-height:100px;line-height:1.5}
input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
input.bad{border-color:var(--bad)}input::placeholder,textarea::placeholder{color:var(--mu);opacity:.7}
.pre{display:flex;align-items:stretch}.pre>b{display:grid;place-items:center;padding:0 14px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--soft);color:var(--mu);font-weight:700;white-space:nowrap}.pre input{border-radius:0 12px 12px 0}
.hint{display:flex;align-items:center;gap:6px;min-height:20px;margin-top:6px;font-size:13px;color:var(--mu)}.hint:empty{display:none}.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.note{margin:-8px 0 16px;font-size:12.5px;color:var(--mu)}
.soc{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}.soc .si{width:42px;height:42px;border-radius:10px;background:var(--onbg);color:var(--ac);display:grid;place-items:center;flex:none}
.soc .sb{flex:1;min-width:0}.soc .sl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;color:var(--tx)}.soc .hint{margin-top:4px;min-height:0}
.mav{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}.avwrap{position:relative;flex:none}

support:()=>shell('support',mbar(t('support'))+panel(t('support'),'We are happy to help','',`<div class=pbody>
<div class=infogrid>${EM?`<a class="fc lnk" href="mailto:${EM}"><span class=fi>${ic('mail',18)}</span><div class=fv><small>Email</small><b>${EM}</b></div></a>`:''}${PH?`<div class=fc><span class=fi>${ic('phone',18)}</span><div class=fv><small>Phone</small><b>${PH}</b></div></div>`:''}${HR?`<div class=fc><span class=fi>${ic('clock',18)}</span><div class=fv><small>Hours</small><b>${HR}</b></div></div>`:''}</div>
<h3 class=sub>${t('contact')}</h3><label class=fld><span class=l>Subject</span><input id=sj maxlength=150></label><label class=fld><span class=l>Message</span><textarea id=ms rows=5 placeholder="How can we help?" maxlength=4000></textarea></label>
<button class="btn pri" data-act=ticket>Send</button><p id=tout class=mu style="margin:10px 0 0"></p>
<div class=danger><h3>${t('delete')}</h3><p>This permanently deletes your account, profile, gallery and friends. It cannot be undone.</p><label class=fld><span class=l>Type DELETE to confirm</span><input id=cf autocomplete=off></label><button class=dng data-act=del>${t('delete')}</button><p id=dout class=mu style="margin:10px 0 0"></p></div></div>`)),
setup:()=>`<div class=setup><div class=stepper><i></i>Almost there</div><h1>Set up your profile</h1><p class=lead>Choose a username and, if you like, a profile photo. Friends use your username to find you.</p>
<div class=card><div class=pad style="display:grid;justify-items:center;gap:10px;text-align:center">${avtap(96,'ring')}<p class=avnote style="color:var(--mu);font-size:13px">Tap photo to choose a picture (optional)</p></div>
<div class=pbody style="padding-top:0"><label class=fld><span class=l>Display name</span><input id=fn maxlength=40 autocomplete=name value="${esc(P.full_name||U.email.split('@')[0])}"></label>
<label class=fld style="margin:0"><span class=l>Username <em>required</em></span><div class=pre><b>@</b><input id=un maxlength=24 autocomplete=off autocapitalize=none spellcheck=false placeholder="yourname" autofocus></div><div class=hint id=uh></div></label></div></div>
<button class="btn pri blk" id=go data-act=setupGo disabled>Continue</button><p style="text-align:center;margin-top:14px"><button class=link data-act=out>Sign out</button></p></div>`
};

async function loadP(){
 const {data,error}=await sb.from('profiles').select('*').eq('id',U.id).single();if(error)throw error;P=data||{};
 const g=await sb.from('gallery').select('*').eq('user_id',U.id).order('created_at',{ascending:false});P._g=g.data||[];P._gerr=g.error?g.error.message:'';
 try{const {data:sub}=await sb.from('subscriptions').select('status,current_period_end').maybeSingle();const act=sub&&sub.status==='active'&&new Date(sub.current_period_end)>new Date();PLAN={pro:!!act,end:act?sub.current_period_end:null}}catch(_){}
}
async function fetchPD(id){
 const {data,error}=await sb.rpc('public_profile',{p_uid:id,p_preview:PREVIEW&&id===U.id,p_nsfw:NSFW});
 PD=error?null:data;FAILED=PD?null:id;
 if(PD&&PD.own){const r=(await sb.from('friendships').select('user_id').eq('friend_id',U.id).eq('status','pending')).data||[],ids=r.map(x=>x.user_id);
  REQ=ids.length?(await sb.from('public_profiles').select('id,full_name,username,avatar_url').in('id',ids)).data||[]:[]}
}
async function route(){
 if(!U)return;
 const h=(location.hash||'#home').slice(1).split('/'),k=h[0];
 if(!P.username&&k!=='setup'){location.replace('#setup');return}
 if(P.username&&k==='setup'){location.replace('#home');return}
 if(!V[k]||(k==='home'&&DESK.matches)){location.replace(DESK.matches?'#info':'#home');return}
 const my=++RT;
 if(k!=='preview'&&PREVIEW){PREVIEW=false;PD=null}
 if(k==='setup'){}
 else if(k==='user'){const id=h[1];if(!id||id===U.id){location.replace('#info');return}if(!PD||PD.id!==id){app.innerHTML=skel();await fetchPD(id)}}
 else if(k==='preview'){if(!PREVIEW||!PD||PD.id!==U.id||PD.own){PREVIEW=true;app.innerHTML=skel();await fetchPD(U.id)}}
 else if(!PD||PD.id!==U.id||!PD.own){app.innerHTML=skel();await fetchPD(U.id)}
 if(my!==RT)return;
 if(!PD&&k!=='setup'){app.innerHTML='<div class="card pad"><p>We could not load this profile. Check your connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>';return}
 app.innerHTML=V[k](h[1]);Nova.applyLang();
 if(k==='setup')initSetup();
}
const ask=(title,text,ok='Delete',danger=true)=>new Promise(r=>{const o=document.createElement('div');o.className='ov';o.style.zIndex=70;o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
 o.innerHTML=`<div class=sheet><h3>${esc(title)}</h3><p>${esc(text)}</p><div class=acts><button class="btn sec" data-n>${t('cancel')}</button><button class="btn ${danger?'':'pri'}" ${danger?'style="background:var(--bad);color:#fff"':''} data-y>${esc(ok)}</button></div></div>`;
 o.onclick=e=>{if(e.target===o||e.target.closest('[data-n]')){o.remove();r(false)}else if(e.target.closest('[data-y]')){o.remove();r(true)}};document.body.append(o);o.querySelector('[data-n]').focus()});

const dropOld=u=>{const m=/\/avatars\/([^?]+)/.exec(u||'');if(m)sb.storage.from('avatars').remove([decodeURIComponent(m[1])])};
async function uploadAvatar(file){
 if(file.size>15e6)throw new Error('That image is larger than 15 MB');
 const blob=await Nova.imgBlob(file,512,.88,true),path=`${U.id}/avatar_${Date.now()}.jpg`;
 const up=await sb.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
 const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
 const {error}=await sb.from('profiles').update({avatar_url:url}).eq('id',U.id);if(error){sb.storage.from('avatars').remove([path]);throw error}
 dropOld(P.avatar_url);P.avatar_url=url;inv()}
function avActs(){return P.avatar_url?'<button class=link data-act=rmAv>Remove photo</button>':''}
function paintAv(){document.querySelectorAll('.avtap').forEach(b=>{const a=b.querySelector('.avt');if(a)a.outerHTML=Nova.avatar(P,+b.dataset.s,b.dataset.c||'')});const a=$('#ava');if(a)a.innerHTML=avActs()}
const refreshBehind=()=>{if((location.hash||'').slice(1)!=='setup')route()};

function initSetup(){
 const go=$('#go'),upd=s=>{const u=s||UN;go.disabled=!(u.ok&&!u.pending&&$('#fn').value.trim().length>=2)};
 UN=Nova.unameField($('#un'),$('#uh'),null,upd);$('#fn').addEventListener('input',upd);
}
async function saveProfile(btn,body){
 const lab=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class=spin></i> Saving…';
 const {error}=await sb.from('profiles').update(body).eq('id',U.id);btn.disabled=false;btn.innerHTML=lab;
 if(error){const taken=error.code==='23505',h=$('#uh');
  if(h&&body.username){h.className='hint bad';h.innerHTML=ic('alert',14)+'<span>'+(taken?'That username was just taken. Try another.':'This username is not allowed.')+'</span>'}
  Nova.toast(taken||/username/i.test(error.message)?(taken?'Username already taken':'Invalid username'):error.message,'err');return false}
 await loadP();inv();return true}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-go],[data-act],[data-lang]');if(!el)return;const d=el.dataset;
 if(d.go){if(d.go=='back'){history.length>1?history.back():location.hash='home'}else location.hash=d.go}
 if(d.lang){await Nova.set('lang',d.lang);route()}
 if(d.act=='out'){await sb.auth.signOut();location.href='index.html'}
 if(d.act=='emoji'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=sheet><div class=em>${EMOJI.map(x=>`<button>${x}</button>`).join('')}</div></div>`;
  o.onclick=async ev=>{if(ev.target.tagName=='BUTTON')await Nova.set('quick',ev.target.textContent);o.remove();route()};document.body.append(o)}
 if(d.act=='pickAv'){AVT=el;$('#avf').click()}
 if(d.act=='rmAv'&&await ask('Remove profile photo?','Your initials will be shown instead.','Remove')){
  const old=P.avatar_url,{error}=await sb.from('profiles').update({avatar_url:null}).eq('id',U.id);if(error)return Nova.toast(error.message,'err');
  dropOld(old);P.avatar_url=null;inv();paintAv();Nova.toast('Photo removed')}
 if(d.act=='setupGo'){const name=$('#fn').value.trim();if(!UN.ok||name.length<2)return;
  if(await saveProfile(el,{full_name:name,username:UN.val})){Nova.toast(`Welcome, @${P.username}`);location.hash=DESK.matches?'info':'home'}}
 if(d.act=='ticket'){const {error}=await sb.from('support_tickets').insert({user_id:U.id,email:U.email,subject:$('#sj').value,message:$('#ms').value});
  $('#tout').textContent=error?(/permission denied/i.test(error.message)?'Permission denied. Run fix-gallery-permissions.sql in Supabase once.':'Please fill subject (3+) and message (10+ characters).'):'Sent. We will reply by email.';if(!error){$('#sj').value='';$('#ms').value=''}}
 if(d.act=='del'){if($('#cf').value!=='DELETE')return $('#dout').textContent='Type DELETE exactly.';const {error}=await sb.rpc('delete_my_account');if(error)return $('#dout').textContent=error.message;await sb.auth.signOut();location.href='index.html'}
});
document.addEventListener('change',async e=>{const x=e.target;
 if(x.id==='avf'){const f=x.files[0];x.value='';if(!f)return;const w=AVT;w&&w.classList.add('busy');
  try{await uploadAvatar(f);paintAv();Nova.toast('Profile photo updated')}catch(er){Nova.toast(er.message||'Upload failed','err')}w&&w.classList.remove('busy');return}
 const k=x.dataset?.k;if(!k)return;
 if(k=='hideMature'&&!x.checked){x.checked=true;if(await ask('Enable 🔞 Mature Content','Explicit 18+ content may be shown. Only turn this on if you are 18 or older.',t('yes'),false)){await Nova.set('hideMature',false);route()}return}
 await Nova.set(k,x.checked)});
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
DESK.addEventListener?DESK.addEventListener('change',()=>route()):DESK.addListener(()=>route());
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.href='index.html'});
/* boot only after nova-profile.js has registered its views */
const boot=async()=>{app.innerHTML=skel();
 const {data}=await sb.auth.getSession();if(!data.session){try{sessionStorage.setItem('postLoginRedirect','profile.html')}catch(_){}return location.href='index.html'}
 U=data.session.user;await Nova.sync(U.id);
 try{await loadP()}catch(er){app.innerHTML='<div class="card pad"><p>We could not load your profile. Check your connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>';return}
 route()};
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot):boot();
</script><script src="nova-profile.js"></script>
<input type="file" id="avf" accept="image/jpeg,image/png,image/webp,image/gif,image/heic" hidden>
<input type="file" id="gf" accept="image/jpeg,image/png,image/webp,image/gif,image/heic" multiple hidden>
