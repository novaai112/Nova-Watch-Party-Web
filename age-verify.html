<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffcf3">
<title>Nova — Age verification</title>
<link rel="icon" href="7949.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="age-verify.css">
<script>
/* theme: follow the app's saved choice, else the device setting (age-verify.css handles both) */
try{var t=localStorage.getItem('nova-watch-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
</head>
<body>

<!-- ===================== 1. SET UP (no camera, no mature media loaded) ===================== -->
<main id="v-intro" class="screen intro" aria-labelledby="introTitle">
  <header class="topbar">
    <a class="backbtn" id="backLink" href="profile.html#settings" aria-label="Back — keep mature content hidden">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 id="introTitle" tabindex="-1">Verify Your Age</h1>
    <span class="topbar-gap" aria-hidden="true"></span>
  </header>

  <p class="sub">Unlock mature content with a quick<br>face scan, private and one-time.</p>

  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 280 330" focusable="false">
      <defs>
        <linearGradient id="gLine" x1="0" x2="1"><stop offset="0" stop-color="#f7c948"/><stop offset="1" stop-color="#f06a45"/></linearGradient>
        <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a5b" stop-opacity=".28"/><stop offset="1" stop-color="#f59a5b" stop-opacity="0"/></linearGradient>
        <clipPath id="hexClip"><path d="M140 40 L218 85 V175 L140 220 L62 175 V85 Z"/></clipPath>
      </defs>
      <path class="brk" d="M30 70V48a14 14 0 0 1 14-14h22M250 70V48a14 14 0 0 0-14-14h-22M30 260v22a14 14 0 0 0 14 14h22M250 260v22a14 14 0 0 1-14 14h-22"/>
      <path class="hex" d="M140 40 L218 85 V175 L140 220 L62 175 V85 Z" transform="translate(0 38)"/>
      <g transform="translate(0 38)">
        <ellipse class="hd" cx="140" cy="108" rx="34" ry="44"/>
        <path class="hd" d="M70 168c8-30 38-34 54-40M210 168c-8-30-38-34-54-40"/>
      </g>
      <g class="sweepg">
        <rect x="62" y="0" width="156" height="34" fill="url(#gBand)" transform="translate(0 6)" clip-path="none"/>
        <path d="M6 40Q140 -4 274 40" fill="none" stroke="url(#gLine)" stroke-width="3.2" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="bottom">
    <div id="introError" class="note err" role="alert" hidden></div>
    <label class="consent" for="consent">
      <input type="checkbox" id="consent">
      <span>I am 18 or older. I agree to use my camera for this one-time check and I have read the <a href="https://nova-watch-party.vercel.app/profile.html#policy/privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="https://nova-watch-party.vercel.app/profile.html#policy/terms" target="_blank" rel="noopener">Terms</a>.</span>
    </label>
    <button class="cta" id="startBtn" type="button" disabled>Scan My Face</button>
  </div>
</main>

<!-- ===================== 2. FACE SCANNING (camera on) ===================== -->
<main id="v-capture" class="screen scan" hidden aria-labelledby="capTitle">
  <header class="topbar">
    <button class="backbtn" id="cancelBtn" type="button" aria-label="Stop scanning and go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 id="capTitle" tabindex="-1">Face Scanning</h1>
    <span class="topbar-gap" aria-hidden="true"></span>
  </header>

  <div class="stagewrap">
    <div class="face" id="face" data-g="idle" data-scan="false">
      <div class="disc">
        <video id="cam" playsinline muted autoplay aria-label="Your live camera preview"></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div class="sweep" aria-hidden="true"></div>
        <div class="loader" id="loader"><div class="spin" aria-hidden="true"></div></div>
      </div>
      <svg class="ringsvg" viewBox="0 0 100 100" aria-hidden="true"><circle class="ringbg" cx="50" cy="50" r="48.6"/><circle class="ringfg" id="ringFg" cx="50" cy="50" r="48.6"/></svg>
    </div>
  </div>

  <div class="readout">
    <div class="pct" id="pct" aria-hidden="true">0%</div>
    <p class="info" id="info" data-k="" aria-hidden="true">Starting camera…</p>
  </div>
  <div id="debug" class="debug" hidden></div>
</main>

<!-- ===================== 3. RESULT POP-UP (success or error) ===================== -->
<div class="pop" id="popup" hidden>
  <div class="sheet" id="resBox" data-k="ok" role="alertdialog" aria-modal="true" aria-labelledby="resTitle" aria-describedby="resText">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 64 64"><circle class="a" cx="32" cy="32" r="28"/><path id="resMark" d="M20 33l8 8 17-18"/></svg>
    </div>
    <h2 id="resTitle" tabindex="-1">Verified</h2>
    <p id="resText"></p>
    <p class="note2" id="resNote" hidden></p>
    <p class="code" id="resCode" hidden></p>
    <div class="btns">
      <button class="cta" id="resPrimary" type="button">Continue</button>
      <button class="ghost" id="resSecondary" type="button" hidden>Keep Mature Hidden</button>
    </div>
  </div>
</div>
<div class="sr" id="liveStatus" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="/api/config"></script><script src="nova-core.js"></script>
<script src="liveness-engine.js"></script>
<script src="age-verify.js"></script>
</body>
</html>
